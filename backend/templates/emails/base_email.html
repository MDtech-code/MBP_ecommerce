<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block subject %}{{ brand_name }}{% endblock %}</title>
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; background-color: #f4f4f5; font-family: Inter, Arial, sans-serif; }

    /* Wrapper */
    .email-wrapper { width: 100%; background-color: #f4f4f5; padding: 40px 16px; }

    /* Card */
    .email-card {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* Header */
    .email-header {
      background-color: #ffffff;
      padding: 32px 40px 24px;
      text-align: center;
      border-bottom: 3px solid #DC2626;
    }
    .email-header .brand-name {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-decoration: none;
    }
    .email-header .brand-bike { color: #111827; }
    .email-header .brand-express { color: #DC2626; }
    .email-header .brand-tagline {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    /* Body */
    .email-body { padding: 40px 40px 32px; }
    .email-title {
      font-size: 24px;
      font-weight: 800;
      color: #111827;
      margin: 0 0 8px;
    }
    .email-divider {
      width: 48px;
      height: 3px;
      background-color: #DC2626;
      border: none;
      margin: 0 0 24px;
    }
    .email-greeting {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      margin: 0 0 12px;
    }
    .email-text {
      font-size: 15px;
      color: #4b5563;
      line-height: 1.7;
      margin: 0 0 24px;
    }

    /* CTA Button */
    .email-btn-wrap { text-align: center; margin: 28px 0; }
    .email-btn {
      display: inline-block;
      background-color: #DC2626;
      color: #ffffff !important;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 14px 36px;
      border-radius: 8px;
    }

    /* Expiry */
    .email-expiry {
      text-align: center;
      font-size: 13px;
      color: #6b7280;
      margin: 0 0 24px;
    }

    /* Security block */
    .email-security {
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px 20px;
      margin: 24px 0 0;
    }
    .email-security p {
      font-size: 13px;
      color: #6b7280;
      margin: 0 0 4px;
      line-height: 1.6;
    }
    .email-security p:last-child { margin: 0; }
    .email-security strong { color: #374151; }

    /* Fallback link */
    .email-fallback {
      margin: 20px 0 0;
      padding: 16px 20px;
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
    }
    .email-fallback p {
      font-size: 13px;
      color: #6b7280;
      margin: 0 0 6px;
    }
    .email-fallback a {
      font-size: 12px;
      color: #DC2626;
      word-break: break-all;
    }

    /* OTP Block */
    .otp-block {
      text-align: center;
      margin: 24px 0;
    }
    .otp-code {
      display: inline-block;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 12px;
      color: #DC2626;
      background-color: #fef2f2;
      border: 2px dashed #DC2626;
      border-radius: 12px;
      padding: 16px 32px;
    }

    /* Footer */
    .email-footer {
      background-color: #f9fafb;
      border-top: 1px solid #e5e7eb;
      padding: 24px 40px;
      text-align: center;
    }
    .email-footer .social-links { margin: 0 0 16px; }
    .email-footer .social-links a {
      display: inline-block;
      margin: 0 6px;
      width: 32px;
      height: 32px;
      background-color: #e5e7eb;
      border-radius: 50%;
      text-align: center;
      line-height: 32px;
      text-decoration: none;
      font-size: 13px;
      color: #374151;
      font-weight: 700;
    }
    .email-footer p {
      font-size: 12px;
      color: #9ca3af;
      margin: 0 0 4px;
    }
    .email-footer a { color: #DC2626; text-decoration: none; }
    .email-footer .copyright { margin-top: 8px; }

    /* Mobile */
    @media only screen and (max-width: 600px) {
      .email-body { padding: 28px 24px 24px; }
      .email-header { padding: 24px 24px 20px; }
      .email-footer { padding: 20px 24px; }
      .email-title { font-size: 20px; }
      .otp-code { font-size: 32px; letter-spacing: 8px; padding: 12px 20px; }
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-card">

      {% include "emails/partials/header.html" %}

      <div class="email-body">
        {% block body %}{% endblock %}
      </div>

      {% include "emails/partials/footer.html" %}

    </div>
  </div>
</body>
</html>
