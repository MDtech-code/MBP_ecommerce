[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -v
filterwarnings =
    ignore::DeprecationWarning:sentry_sdk.*
markers =
    unit: pure unit test, no DB no HTTP
    integration: full HTTP stack test
    slow: marks slow tests, deselect with -m "not slow"



