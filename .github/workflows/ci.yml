name: MBP Ecommerce CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: mbp_tests
      TEST_POSTGRES_PASSWORD: test-only
      TEST_POSTGRES_DB: test_mbp_ecommerce
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mbp_tests
          POSTGRES_USER: mbp_tests
          POSTGRES_PASSWORD: test-only
        options: >-
          --health-cmd "pg_isready -U mbp_tests -d mbp_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements-test.txt
      # Keep the full historical suite visible, including failures still being
      # repaired in the staged registration rollout. No skips/continue-on-error.
      - name: Run all backend tests
        working-directory: backend
        run: python -m pytest --tb=short -v
      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests and scoped coverage gate
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-foundation-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
