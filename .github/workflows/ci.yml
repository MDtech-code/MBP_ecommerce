name: MBP Ecommerce CI

# ─────────────────────────────────────────────────────────────────────────────
# SCOPE — read this before adding steps.
#
# This pipeline currently verifies that the project still INSTALLS and BUILDS.
# It is a green-baseline scaffold, not a test suite.
#
# What is checked today:
#   backend  → requirements resolve on a clean Linux runner
#              → Django boots with all 17 apps (every model, settings, AppConfig.ready)
#              → no model changes have drifted away from the committed migrations
#   frontend → npm ci from the lockfile
#              → 35 foundation tests (transformers, csrf, accountService)
#              → production bundle builds
#
# What is checked today (frontend only): the surviving 35-test foundation suite
# (transformers, csrf bootstrap, accountService) now that its MSW harness has been
# restored. Backend tests do not exist yet — the historical suite was written
# against the pre-refactor structure and was removed with it. Writing them is a
# separate, deliberate effort (see docs/00_CODEBASE_MAP.md §7).
#
# Deliberately not wired up yet, because they are red for pre-existing reasons
# unrelated to this pipeline (see §7 items 11 and 19 of the map):
#   npm run lint       → 5 eslint errors (react-hooks/set-state-in-effect, no-unused-vars)
#   npm run lint:fsd   → 21 FSD architecture violations
#   npm run test:coverage → per-file 90% gate over 6 files, only 3 are covered
# Turn each one on in the same PR that makes it pass, so a red check always means
# "you broke something", never "someone left a TODO".
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: backend — install, boot, migrations
    runs-on: ubuntu-latest

    # settings.py is env-driven: these are fake CI values, never real credentials.
    # config.settings requires SECRET_KEY, POSTGRES_*, GOOGLE_*, FACEBOOK_* with no
    # default, so Django cannot even import without them.
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
      POSTGRES_DB: mbp_ci
      POSTGRES_USER: mbp_ci
      POSTGRES_PASSWORD: ci-only-not-a-real-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      GOOGLE_CLIENT_ID: ci-only
      GOOGLE_CLIENT_SECRET: ci-only
      GOOGLE_REDIRECT_URI: https://localhost:8000/api/accounts/auth/social/
      FACEBOOK_APP_ID: ci-only
      FACEBOOK_APP_SECRET: ci-only

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mbp_ci
          POSTGRES_USER: mbp_ci
          POSTGRES_PASSWORD: ci-only-not-a-real-password
        options: >-
          --health-cmd "pg_isready -U mbp_ci -d mbp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Import-level smoke test. Fails on: unresolved imports, a broken
      # AppConfig.ready(), bad middleware order, or invalid model definitions.
      # Errors only — warnings are surfaced in the log but do not block, so this
      # check stays a signal for real breakage rather than a drift alarm.
      - name: Django system check
        working-directory: backend
        run: python manage.py check

      # Fails if a model was edited without committing its migration.
      # `migrate` first so Django can diff against a real schema, not an empty DB.
      - name: Reject missing migrations
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run

  frontend-check:
    name: frontend — install and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      # Also type-checks every import path through the FSD aliases.
      # (Fails on a broken import even though the app has no TypeScript.)
      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_ORIGIN: https://localhost:8000
          VITE_GOOGLE_CLIENT_ID: ci-only
          VITE_FACEBOOK_APP_ID: ci-only
        run: npm run build
