name: MBP Ecommerce CI

# ─────────────────────────────────────────────────────────────────────────────
# SCOPE — read this before adding steps.
#
# The test suite has been intentionally reduced to a placeholder while the
# project's test architecture is being decided. Every job below exists only to
# prove that dependencies install and that the frontend still builds.
#
#   test              → requirements install + smoke placeholder
#   redis-integration → requirements install + smoke placeholder
#   frontend-test     → npm ci + smoke placeholder + production build
#
# IMPORTANT: a green run here means "dependencies install, the bundle builds".
# It does NOT mean the application behaves correctly. There are currently no
# assertions covering apps, URLs, the error envelope, the error-code registry,
# the cache adapter, or any API contract.
#
# The build step is kept because it resolves every import path through the FSD
# aliases, so a broken cross-layer import still fails here.
#
# When the real test strategy is chosen, replace the placeholder modules and
# wire the runners back into these jobs.
#
# Still deliberately NOT wired up:
#   npm run lint         → 5 eslint errors (react-hooks/set-state-in-effect, no-unused-vars)
#   npm run lint:fsd     → 21 FSD architecture violations
#   npm run test:coverage → per-file 90% gate over 6 files, only 3 are covered
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: dependency install + placeholder ───────────────────────────────
  test:
    name: backend — unit suite and migrations
    runs-on: ubuntu-latest

    # settings.py is env-driven: config.settings requires SECRET_KEY,
    # POSTGRES_*, GOOGLE_* and FACEBOOK_* with no default, so Django cannot
    # even import without them. These are fake CI values, never credentials.
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
      POSTGRES_DB: mbp_ci
      POSTGRES_USER: mbp_ci
      POSTGRES_PASSWORD: ci-only-not-a-real-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      GOOGLE_CLIENT_ID: ci-only
      GOOGLE_CLIENT_SECRET: ci-only
      GOOGLE_REDIRECT_URI: https://localhost:8000/api/accounts/auth/social/
      FACEBOOK_APP_ID: ci-only
      FACEBOOK_APP_SECRET: ci-only

    # Kept so the migration-drift step can run when it is re-enabled.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mbp_ci
          POSTGRES_USER: mbp_ci
          POSTGRES_PASSWORD: ci-only-not-a-real-password
        options: >-
          --health-cmd "pg_isready -U mbp_ci -d mbp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run unit suite
        working-directory: backend
        run: python -m pytest --tb=short -v

  # ── Backend: Redis lane placeholder ─────────────────────────────────────────
  redis-integration:
    name: backend — redis integration
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.test_redis_settings
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      SECRET_KEY: ci-only-not-a-real-secret
      POSTGRES_DB: mbp_ci
      POSTGRES_USER: mbp_ci
      POSTGRES_PASSWORD: ci-only-not-a-real-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      GOOGLE_CLIENT_ID: ci-only
      GOOGLE_CLIENT_SECRET: ci-only
      GOOGLE_REDIRECT_URI: https://localhost:8000/api/accounts/auth/social/
      FACEBOOK_APP_ID: ci-only
      FACEBOOK_APP_SECRET: ci-only

    # No Redis container: the placeholder asserts nothing about the cache.
    # Restore redis:7-alpine here when the TwoLevelCache lane is rebuilt.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run cache placeholder
        working-directory: backend
        run: >-
          python -m pytest apps/core/tests/test_cache_redis.py
          --ds=config.test_redis_settings --tb=short -v

  # ── Frontend: placeholder + build ───────────────────────────────────────────
  frontend-test:
    name: frontend — tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      # Resolves every import path through the FSD aliases, so a broken
      # cross-layer import fails here even though the app has no TypeScript.
      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_ORIGIN: https://localhost:8000
          VITE_GOOGLE_CLIENT_ID: ci-only
          VITE_FACEBOOK_APP_ID: ci-only
        run: npm run build
