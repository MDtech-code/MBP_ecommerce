# Dedicated disposable services; never uses application database volumes.
# docker compose -f compose.test.yml up -d --wait
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mbp_tests
      POSTGRES_USER: mbp_tests
      POSTGRES_PASSWORD: test-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbp_tests -d mbp_tests"]
      interval: 2s
      timeout: 5s
      retries: 20
